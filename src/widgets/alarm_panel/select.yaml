lvgl:
  on_boot:
    then:
      - script.execute: get_alarm_panel_amount_btn
      - lvgl.obj.update:
          id: ${alarm_panel_widget_name_1}_btn
          shadow_color: color_misty_blue

  top_layer:
    widgets:
      - obj:
          id: alarm_panel_select_widget
          hidden: true
          y: -40
          width: 440
          height: 100
          align: bottom_mid
          pad_all: 0
          bg_opa: transp
          border_opa: transp
          border_width: 0
          scrollable: false
          radius: 20
          widgets:
            - obj:
                id: alarm_panel_select_widget_cont
                width: 440
                height: 60
                align: center
                bg_opa: transp
                border_opa: transp
                border_width: 0
                pad_all: 0
                layout:
                  type: flex
                  flex_align_main: space_around
                  flex_align_cross: center
                  flex_align_track: center
                widgets:
                  - obj:
                      id: ${alarm_panel_widget_name_1}_btn
                      width: 40
                      height: 40
                      pad_all: 0
                      radius: 30
                      bg_opa: transp
                      border_opa: transp
                      shadow_width: 5
                      shadow_spread: 1
                      shadow_color: color_black
                      pressed:
                        bg_color: color_black
                        shadow_width: 4
                      widgets:
                        - label:
                            id: ${alarm_panel_widget_name_1}_icon
                            align: center
                            text_font: nunito_20
                            text_color: color_misty_blue
                            text: "1"
                      on_press:
                        - lvgl.page.show: ${alarm_panel_widget_name_1}_page
                        - lvgl.obj.update:
                            id: ${alarm_panel_widget_name_1}_btn
                            shadow_color: color_misty_blue
                        - lvgl.obj.update:
                            id: ${alarm_panel_widget_name_2}_btn
                            shadow_color: color_black


                  - obj:
                      id: ${alarm_panel_widget_name_2}_btn
                      width: 40
                      height: 40
                      pad_all: 0
                      radius: 30
                      bg_opa: transp
                      border_opa: transp
                      shadow_width: 5
                      shadow_spread: 1
                      shadow_color: color_black
                      pressed:
                        bg_color: color_black
                        shadow_width: 4
                      widgets:
                        - label:
                            id: ${alarm_panel_widget_name_2}_icon
                            align: center
                            text_font: nunito_20
                            text_color: color_misty_blue
                            text: "2"
                      on_press:
                        - lvgl.page.show: ${alarm_panel_widget_name_2}_page
                        - lvgl.obj.update:
                            id: ${alarm_panel_widget_name_1}_btn
                            shadow_color: color_black
                        - lvgl.obj.update:
                            id: ${alarm_panel_widget_name_2}_btn
                            shadow_color: color_misty_blue


script:
  - id: get_alarm_panel_amount_btn
    then:
      - lambda: |-
          int alarm_panels = ${alarm_panels_amount};
          
          if (alarm_panels >= 2) {
            // lv_obj_set_width(id(alarm_panel_select_widget_cont), 290);
            lv_obj_clear_flag(id(${alarm_panel_widget_name_1}_btn), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(${alarm_panel_widget_name_2}_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${alarm_panel_widget_name_1}_btn), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(${alarm_panel_widget_name_2}_btn), LV_OBJ_FLAG_HIDDEN);
          }
          
