                              bg_opa: transp
                              border_opa: transp
                              border_width: 0
                              shadow_width: 4
                              shadow_color: 0xFFFFFF
                              shadow_offset_x: -4
                              shadow_offset_y: -2
                              shadow_opa: 30%

                          - obj:
                              width: 65
                              height: 65
                              pad_all: 0
                              align: center
                              clickable: false
                              scrollable: false
                              radius: 50
                              border_opa: transp
                              border_width: 0
                              bg_color: color_slate_blue_gray
                              widgets:
                                - label:
                                    id: ${widget_name}_oscillating_btn_icon
                                    align: center
                                    text_font: mdi_icons_28
                                    text_color: color_misty_blue
                                    text: "${swing_off_icon}"

        - obj:
            id: ${widget_name}_secondary_buttons_background
            y: 360
            width: 440
            height: 60
            align: top_mid
            clickable: false
            scrollable: false
            radius: 20
            pad_all: 0
            bg_color: color_slate_blue_gray
            border_opa: transp
            border_width: 0
            shadow_opa: transp

        - obj:
            id: ${widget_name}_circle_background
            y: 60
            width: 150
            height: 150
            align: center
            clickable: false
            scrollable: false
            radius: 75
            pad_all: 0
            bg_color: color_black
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            widgets:
              - obj:
                  width: 100
                  height: 100
                  pad_all: 0
                  align: center
                  clickable: false
                  scrollable: false
                  radius: 50
                  border_opa: transp
                  border_width: 0
                  bg_color: color_slate_blue_gray

              - obj:
                  width: 150
                  height: 150
                  align: center
                  clickable: false
                  scrollable: false
                  radius: 75
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  widgets:
                    - arc:
                        clickable: false
                        adjustable: false
                        adv_hittest: false
                        align: center
                        width: 130
                        height: 130
                        min_value: 0
                        max_value: 100
                        start_angle: 0
                        end_angle: 360
                        rotation: 0
                        arc_width: 5
                        arc_color: color_steel_blue
                        arc_rounded: false
                        indicator:
                          arc_width: 5
                          arc_opa: transp
                        knob:
                          bg_opa: transp

                    - arc:
                        id: ${widget_name}_arc
                        clickable: true
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 130
                        height: 130
                        min_value: 0
                        max_value: 100
                        value: 0
                        start_angle: 0
                        end_angle: 270
                        rotation: 135
                        arc_width: 5
                        arc_color: color_steel_blue
                        arc_rounded: false
                        indicator:
                          arc_width: 5
                          arc_color: color_steel_blue
                        knob:
                          bg_opa: transp

                        on_value:
                          - lambda: |-
                              int value = int(x);

                              if (value < 0) value = 0;
                              if (value > 100) value = 100;

                              id(${widget_name}_current_percentage) = value;

                              static char buffer[16];
                              snprintf(buffer, sizeof(buffer), "%d%%", value);
                              lv_label_set_text(id(${widget_name}_percentage_label), buffer);

                        on_release:
                          - lambda: |-
                              int raw_value = int(x);
                              int rounded_value = raw_value;

                              if (rounded_value < 0) rounded_value = 0;
                              if (rounded_value > 100) rounded_value = 100;

                              float step = id(${widget_name}_percentage_step);

                              if (std::isnan(step) || step <= 0.0f) {
                                step = 1.0f;
                              }

                              if (step > 1.0f) {
                                int num_steps = roundf(raw_value / step);
                                rounded_value = roundf(num_steps * step);

                                if (rounded_value < 0) rounded_value = 0;
                                if (rounded_value > 100) rounded_value = 100;
                              }

                              lv_arc_set_value(id(${widget_name}_arc), rounded_value);

                              id(${widget_name}_current_percentage) = rounded_value;

                              static char buffer[16];
                              snprintf(buffer, sizeof(buffer), "%d%%", rounded_value);
                              lv_label_set_text(id(${widget_name}_percentage_label), buffer);

                          - homeassistant.action:
                              action: fan.set_percentage
                              data:
                                entity_id: "${fan_entity}"
                                percentage: !lambda |-
                                  return to_string(id(${widget_name}_current_percentage));

                    - obj:
                        width: 100
                        height: 100
                        pad_all: 0
                        align: center
                        clickable: false
                        scrollable: false
                        radius: 50
                        border_opa: transp
                        border_width: 0
                        bg_opa: transp
                        widgets:
                          - label:
                              id: ${widget_name}_switch_icon
                              align: center
                              text_color: color_misty_blue
                              text_font: mdi_icons_52
                              text: "${power_icon}"
                              on_press:
                                - if:
                                    condition:
                                      lambda: 'return id(${widget_name}_state_sensor).state == "off";'
                                    then:
                                      - homeassistant.action:
                                          action: fan.turn_on
                                          data:
                                            entity_id: "${fan_entity}"
                                    else:
                                      - homeassistant.action:
                                          action: fan.turn_off
                                          data:
                                            entity_id: "${fan_entity}"

        - obj:
            y: 0
            width: 80
            height: 70
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            scrollable: false
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  scrollable: false
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - lvgl.widget.hide: fan_select_widget
              - lvgl.page.show: home_page


script:
  - id: ${widget_name}_start_animation
    then:
      - lambda: |-
          ESP_LOGD("fan", "START_ANIMATION script called");

          if (id(${widget_name}_is_animating)) {
            ESP_LOGD("fan", "Animation already running, skipping");
            return;
          }

          auto img_widget = id(${widget_name}_state_image);
          lv_obj_t* img = img_widget;

          lv_anim_del(img, nullptr);

          lv_img_set_src(img, id(fan_green_image));

          int percentage = id(${widget_name}_current_percentage);

          if (percentage < 1) percentage = 100;
          if (percentage > 100) percentage = 100;

          int anim_time = (int)(3000.0 / (percentage / 33.0));

          if (anim_time < 500) anim_time = 500;
          if (anim_time > 5000) anim_time = 5000;

          ESP_LOGD("fan", "Animation time: %d ms (percentage: %d)", anim_time, percentage);

          bool is_forward = id(${widget_name}_direction_sensor).state == "forward";
          int start_angle = is_forward ? 0 : 3600;
          int end_angle = is_forward ? 3600 : 0;

          ESP_LOGD("fan", "Direction: %s", is_forward ? "forward" : "reverse");

          lv_anim_t anim_rotation;

          lv_anim_init(&anim_rotation);
          lv_anim_set_var(&anim_rotation, img);
          lv_anim_set_values(&anim_rotation, start_angle, end_angle);
          lv_anim_set_time(&anim_rotation, anim_time);
          lv_anim_set_repeat_count(&anim_rotation, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&anim_rotation, [](void * var, int32_t v) {
            lv_img_set_angle((lv_obj_t*) var, v);
          });
          lv_anim_set_path_cb(&anim_rotation, lv_anim_path_linear);
          lv_anim_start(&anim_rotation);

          id(${widget_name}_is_animating) = true;

          ESP_LOGD("fan", "✓ Animation STARTED");

  - id: ${widget_name}_stop_animation
    then:
      - lambda: |-
          ESP_LOGD("fan", "STOP_ANIMATION script called");

          auto img_widget = id(${widget_name}_state_image);
          lv_obj_t* img = img_widget;

          lv_anim_del(img, nullptr);

          lv_img_set_src(img, id(fan_misty_image));

          lv_img_set_angle(img, 0);

          id(${widget_name}_is_animating) = false;

          ESP_LOGD("fan", "✓ Animation STOPPED");

  - id: ${widget_name}_update_animation_speed
    then:
      - lambda: |-
          ESP_LOGD("fan", "UPDATE_SPEED called");

          if (!id(${widget_name}_is_animating)) {
            ESP_LOGD("fan", "Animation not running, skipping");
            return;
          }

          ESP_LOGD("fan", "Restarting animation with new speed");

          auto img_widget = id(${widget_name}_state_image);
          lv_obj_t* img = img_widget;
          lv_anim_del(img, nullptr);

          id(${widget_name}_is_animating) = false;

      - script.execute: ${widget_name}_start_animation

  - id: ${widget_name}_update_animation_direction
    then:
      - lambda: |-
          ESP_LOGD("fan", "UPDATE_DIRECTION called");

          if (!id(${widget_name}_is_animating)) {
            ESP_LOGD("fan", "Animation not running, skipping");
            return;
          }

          ESP_LOGD("fan", "Restarting animation with new direction");

          auto img_widget = id(${widget_name}_state_image);
          lv_obj_t* img = img_widget;
          lv_anim_del(img, nullptr);

          id(${widget_name}_is_animating) = false;

      - script.execute: ${widget_name}_start_animation

  - id: ${widget_name}_translations
    then:
      - lvgl.label.update:
          id: ${widget_name}_state_label
          text: !lambda |-
            std::string state = id(${widget_name}_state_sensor).state;

            if (state.empty() || state == "unknown" || state == "unavailable") {
              state = "off";
            }

            std::string key = "fan.state." + state;
            return id(i18n_translations).translate(key);

  - id: ${widget_name}_update_preset_buttons_visibility
    then:
      - lambda: |-
          std::string presets_str = id(${widget_name}_preset_modes_sensor).state;
          ESP_LOGD("HVAC", "Available presets: %s", presets_str.c_str());

          if (presets_str.find("eco") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_eco_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_eco_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          if (presets_str.find("away") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_away_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_away_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          if (presets_str.find("boost") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_boost_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_boost_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          if (presets_str.find("comfort") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_comfort_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_comfort_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          if (presets_str.find("home") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_home_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_home_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          if (presets_str.find("sleep") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_sleep_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_sleep_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          if (presets_str.find("smart") != std::string::npos) {
            lv_obj_clear_flag(id(${widget_name}_smart_preset_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(${widget_name}_smart_preset_btn), LV_OBJ_FLAG_HIDDEN);
          }

          ESP_LOGD("HVAC", "Preset buttons visibility updated");
