                  id: ${widget_name}_primary_buttons_controls
                  width: 440
                  height: 100
                  align: center
                  clickable: false
                  scrollable: false
                  radius: 20
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  widgets:
                    - obj:
                        id: ${widget_name}_direction_btn_bg
                        x: 30
                        width: 90
                        height: 90
                        align: left_mid
                        pad_all: 0
                        scrollable: false
                        bg_opa: transp
                        shadow_opa: transp
                        border_opa: transp
                        border_width: 0
                        widgets:
                          - button:
                              id: ${widget_name}_direction_btn
                              width: 70
                              height: 70
                              align: center
                              clickable: true
                              scrollable: false
                              radius: 50
                              pad_all: 0
                              bg_opa: transp
                              border_opa: transp
                              border_width: 0
                              shadow_width: 8
                              shadow_spread: 2
                              shadow_offset_y: 0
                              shadow_color: color_black
                              shadow_opa: cover
                              pressed:
                                bg_color: color_steel_blue
                                shadow_width: 4
