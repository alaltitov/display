                  height: 366
                  align: right_mid
                  radius: 230
                  bg_color: color_slate_blue_gray
                  border_color: color_white
                  border_width: 3
                  border_opa: 15%
                  widgets:
                    - obj:
                        id: ${widget_name}_lightbulb_color
                        x: 67
                        y: -53
                        width: 70
                        height: 70
                        radius: 35
                        align: left_mid
                        bg_color: color_white
                        border_opa: transp
                        shadow_opa: transp
                        
                    - image:
                        id: ${widget_name}_lightbulb_image
                        x: 70
                        y: 0
                        align: left_mid
                        src: lightbulb_image

              # BACKGROUND ARC
              - obj:
                  x: 222
                  width: 444
                  height: 444
                  radius: 222
                  align: right_mid
                  pad_all: 0
                  bg_opa: transp
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - arc:
                        id: ${widget_name}_light_arc_hue
                        hidden: true
                        clickable: true
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        min_value: 0
                        max_value: 360
                        value: 265
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_opa: transp
                          arc_width: 34
                        knob:
                          pad_all: 0
                          bg_opa: transp
                          border_color: color_steel_blue
                          border_width: 4
                          # shadow_color: color_black
