                        max_value: 6500
                        value: 3000
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_opa: transp
                          arc_width: 34
                        knob:
                          pad_all: 0
                          bg_opa: transp
                          border_color: color_steel_blue
                          border_width: 4
                          # shadow_color: color_black
                          # shadow_spread: 2
                          # shadow_width: 13
                          shadow_opa: transp
                        # on_value:


                        on_release:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: "${light_entity}"
                                color_temp_kelvin: !lambda return int(x);


                    - obj:
                        id: ${widget_name}_mode_select_btn
                        clickable: true
                        x: 127
                        y: 100
                        width: 60
                        height: 60
                        radius: 30
                        align: left_mid
                        bg_opa: transp
                        pad_all: 0
                        border_opa: transp
                        border_width: 0
                        shadow_color: color_black
                        shadow_spread: 2
                        shadow_width: 8
                        widgets:
                          - label:
                              id: ${widget_name}_mode_select_icon
                              align: center
                              text_font: mdi_icons_28
                              text_color: color_misty_blue
                              text: "${palette_icon}"
                        on_click:
                          - lambda: |-
                              id(${widget_name}_is_temp_mode) = !id(${widget_name}_is_temp_mode);
                          - script.execute: ${widget_name}_toggle_gradient

        # BACK
        - obj:
            x: 150
