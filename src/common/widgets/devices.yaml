lvgl:
  pages:
    - id: devices_page
      bg_color: color_black
      scrollable: false
      widgets:
        - obj:
            id: devices_panel
            y: 20
            width: 440
            height: 440
            align: top_mid
            clickable: false
            scrollable: false
            radius: 20
            pad_all: 0
            bg_color: color_slate_blue_gray
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
              flex_align_track: center
            widgets: !include_dir_merge_list devices_buttons/enabled
